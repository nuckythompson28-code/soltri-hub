<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏭 김공장 — 쏠트리 현장도구</title>
<style>
  :root{--bg:#0f1216;--panel:#161b22;--panel2:#1c232d;--line:#222b36;--txt:#d7dee8;
    --dim:#8a97a6;--accent:#ff8c42;--accent2:#4fb6ff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Pretendard","Segoe UI","맑은 고딕",system-ui,sans-serif;
    background:linear-gradient(170deg,#0f1216 0%,#141a22 100%);color:var(--txt);
    min-height:100vh;padding:30px 18px 60px}
  .wrap{max-width:560px;margin:0 auto}
  .head{text-align:center;margin-bottom:26px}
  .logo{font-size:54px;line-height:1}
  h1{font-size:25px;font-weight:800;margin:8px 0 3px}
  h1 span{color:var(--accent)}
  .tag{color:var(--dim);font-size:14px;margin:0}
  .sec{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;
    margin:24px 4px 10px;font-weight:700}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  a.card{text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:7px;
    box-shadow:0 4px 16px rgba(0,0,0,.3);transition:transform .12s,border-color .12s}
  a.card:active{transform:scale(.97)}
  a.card:hover{border-color:var(--accent)}
  a.card .emoji{font-size:32px}
  a.card .t{font-size:16px;font-weight:800}
  a.card .b{font-size:12.5px;color:var(--dim);line-height:1.45}
  a.card .tagbadge{align-self:flex-start;font-size:11px;font-weight:800;background:#2a2018;
    color:var(--accent);padding:2px 9px;border-radius:999px;margin-top:2px}
  .foot{margin-top:30px;text-align:center;font-size:12px;color:var(--dim);line-height:1.7}
  .foot b{color:var(--accent2)}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8c42">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="김공장">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});}</script>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="logo">🏭</div>
      <h1>김<span>공장</span></h1>
      <p class="tag">쏠트리 현장 도구함 · CNC 코드 레퍼런스</p>
    </div>

    <div class="sec">CNC 프로그램 분석</div>
    <div class="cards">
      <a class="card" href="o0852.html">
        <span class="emoji">📐</span>
        <span class="t">O0852 매크로</span>
        <span class="b">봉 소재 자동 연속가공 · 오토링크</span>
        <span class="tagbadge">4개 프로그램</span>
      </a>
      <a class="card" href="o0400.html">
        <span class="emoji">🪚</span>
        <span class="t">O0400 반토막</span>
        <span class="b">파이프 파팅(절단) · 묶음 보링</span>
        <span class="tagbadge">7개 프로그램</span>
      </a>
    </div>


    <div class="sec">🎓 입문 교육 (완전초보 반나절)</div>
    <div class="cards">
      <a class="card" href="firststep.html"><span class="emoji">🎓</span><span class="t">CNC 첫걸음</span><span class="b">안전·기계·좌표·코드 입문</span><span class="tagbadge">8단계</span></a>
      <a class="card" href="cheatsheet.html"><span class="emoji">📄</span><span class="t">치트시트</span><span class="b">인쇄해 기계 옆에</span><span class="tagbadge">A4 1장</span></a>
      <a class="card" href="quiz.html"><span class="emoji">✅</span><span class="t">미니 평가</span><span class="b">이해도 10문항</span><span class="tagbadge">퀴즈</span></a>
    </div>

    <p class="foot">
      📲 <b>홈 화면에 추가</b>하면 앱처럼 쓸 수 있어요<br>
      회사 전용 · 검색 노출 차단(noindex)
    </p>
  </div>
</body>
</html>
