<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>호기별 프로그램 — 김공장</title>
<style>
  :root{--bg:#0f1216;--panel:#161b22;--line:#222b36;--txt:#d7dee8;--dim:#8a97a6;
    --accent:#ff8c42;--cyan:#7df9ff;--gold:#ffd23f;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Pretendard","Segoe UI","맑은 고딕",system-ui,sans-serif;
    background:#080a0e;color:var(--txt);min-height:100vh;
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}

  /* 헤더 */
  .top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .home{color:var(--dim);text-decoration:none;font-size:13px;font-family:monospace}
  .home:active{color:var(--accent)}
  h1{font-size:18px;font-weight:800;margin:0;font-family:monospace;color:var(--accent);
    text-shadow:0 0 10px rgba(255,140,66,.6);letter-spacing:1px}
  .sub{color:var(--dim);font-size:12.5px;margin:6px 2px 18px;line-height:1.5}

  /* 선택 그리드 */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .tile{aspect-ratio:1;border-radius:14px;background:#12161d;border:2px solid #243042;
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .1s,box-shadow .15s,border-color .15s;position:relative}
  .tile:active{transform:scale(.95)}
  .tile .n{font-size:26px;font-weight:900;font-family:monospace;color:#cdd6e2;line-height:1;text-shadow:0 0 8px rgba(125,249,255,.25)}
  .tile .sn{font-size:10px;color:var(--dim);font-weight:700;margin-top:1px}
  .tile .pl{font-size:9.5px;font-weight:800;margin-top:5px;font-family:monospace;letter-spacing:.5px}
  /* 프로그램 있는 기계 = 주황 글로우 */
  .tile.has{border-color:#5a3a22}
  .tile.has .pl{color:var(--accent)}
  .tile.has:hover,.tile.has:active{border-color:var(--accent);
    box-shadow:inset 0 0 14px rgba(255,140,66,.22),0 0 12px rgba(255,140,66,.35)}
  .tile.has .n{color:#ffcea6}
  /* 프로그램 없는 기계 = 차분 */
  .tile.none .pl{color:#4a5666}
  .tile.none:hover{border-color:#3a4a5e}

  /* 상세 */
  .detail{display:none}
  .dtop{display:flex;align-items:center;gap:9px;margin-bottom:3px}
  .back{background:none;border:none;color:var(--dim);font-size:13px;font-family:monospace;cursor:pointer;padding:4px 2px}
  .back:active{color:var(--accent)}
  .dno{font-size:34px;font-weight:900;font-family:monospace;color:var(--accent);text-shadow:0 0 14px rgba(255,140,66,.7);line-height:1}
  .dhogi{color:#ffb27a;font-weight:700;font-size:14px}
  .dtype{margin-left:auto;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
  .dprog{font-size:12px;color:var(--gold);font-family:monospace;margin:2px 0 16px}
  .dprog.no{color:var(--dim)}

  .mc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mcrow{background:#12161d;border:1px solid #243042;border-radius:10px;padding:9px 11px;
    display:flex;justify-content:space-between;align-items:center;gap:6px}
  .mcrow .fn{font-size:11.5px;color:#b9c4d0}
  .mcrow .code{font-family:monospace;font-weight:800;color:#ffb27a;font-size:14px;white-space:nowrap}
  .mcrow.none{opacity:.55}
  .mcrow.none .code{color:#566;font-weight:600;font-size:12px}
  .mcrow.std{border-color:#1d4a55}
  .mcrow.std .code{color:var(--cyan)}

  .linkbtn{display:block;text-align:center;margin-top:16px;background:var(--accent);color:#1a1206;
    font-weight:800;border-radius:13px;padding:13px;font-size:14px;text-decoration:none;
    box-shadow:0 0 16px rgba(255,140,66,.45)}
  .linkbtn:active{transform:scale(.98)}
  .nolink{display:block;text-align:center;margin-top:16px;color:var(--dim);font-size:12px;
    border:1px dashed var(--line);border-radius:13px;padding:13px}
  .note{margin-top:14px;font-size:11px;color:var(--dim);line-height:1.5;
    background:#10141a;border-left:2px solid #3a2a1c;border-radius:0 8px 8px 0;padding:8px 11px}
  .foot{margin-top:26px;text-align:center;font-size:11px;color:var(--dim);line-height:1.6}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8c42">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="machine-programs.css">
</head>
<body>
<div class="wrap">

  <!-- ===== 선택 화면 ===== -->
  <section id="select">
    <div class="top">
      <a class="home" href="index.html">◀ 김공장</a>
      <h1>호기별 프로그램</h1>
    </div>
    <p class="sub">호기를 선택하면 <b>배정 프로그램</b>을 먼저 보여줍니다. 품목 전용·보관용 자료와 호기별 M코드도 함께 볼 수 있습니다.</p>
    <div class="assignment-grid" id="grid"></div><noscript><p>호기별 목록을 표시하려면 JavaScript를 켜 주세요.</p></noscript>
    <p class="foot">Soltri · 김공장 · 기계 M코드 대조표 기준</p>
  </section>

  <!-- ===== 상세 화면 ===== -->
  <section id="detail" class="detail">
    <div class="dtop">
      <button class="back" onclick="showSelect()">◀ 뒤로</button>
      <span class="dno" id="dNo">6</span>
      <span class="dhogi">호기</span>
      <span class="dtype" id="dType">HA</span>
    </div>
    <p class="dprog" id="dProg"></p>
    <div id="linkSlot"></div>
    <details class="assignment-group" id="machine-codes"><summary>이 호기의 M코드 보기</summary>
      <div class="mc" id="mc" style="margin-top:12px"></div>
      <div class="note" id="dNote"></div>
    </details>
  </section>

</div>

<script src="machine-programs.js"></script>
<script src="machine-programs-ui.js"></script>
<script>
/* ===== 기계 데이터 (출처: 기계 M코드 대조표) =====
   null = 해당 기능 M코드 없음. spin: 정회전(cw)/역회전(ccw). */
const byNo = SoltriPrograms.byNo;

/* ---- 선택 그리드 렌더 ---- */
const grid = document.getElementById('grid');
SoltriProgramUI.tiles(grid);

/* ---- 상세 렌더 ---- */
function esc(v){ return v==null ? null : v; }
function row(fn, code, opt){
  if(code==null) return '<div class="mcrow none"><span class="fn">'+fn+'</span><span class="code">없음</span></div>';
  const cls = opt==='std' ? ' std' : '';
  return '<div class="mcrow'+cls+'"><span class="fn">'+fn+'</span><span class="code">'+code+'</span></div>';
}

function showDetail(m){
  document.getElementById('select').style.display='none';
  document.getElementById('detail').style.display='block';
  document.getElementById('dNo').textContent = m.no;
  document.getElementById('dType').textContent = m.type + (m.sub ? ' · '+m.sub : '') + ' 타입';
  const dProg = document.getElementById('dProg');
  dProg.className='dprog'+(m.program?'':' no');
  dProg.textContent=m.program?'배정 프로그램 · '+m.program:'프로그램 미배정';
  document.title=m.no+'호기 · '+(m.program||'미배정')+' — 김공장';

  const spinOpt = m.std ? 'std' : null;
  document.getElementById('mc').innerHTML =
    row('보링바 ▲ UP', m.boringUp) +
    row('보링바 ▼ DOWN', m.boringDn) +
    row('면취 ▶ 전진', m.chFwd) +
    row('면취 ◀ 후진', m.chBwd) +
    row('클램프 ◯ OPEN', m.clOpen) +
    row('클램프 ● CLOSE', m.clClose) +
    row('에어 ON', m.airOn) +
    row('에어 OFF', m.airOff) +
    row('주축 정회전(CW)', m.cw, spinOpt) +
    row('주축 역회전(CCW)', m.ccw, spinOpt) +
    row('카운팅', 'M12') +
    row('프로그램 종료', 'M30');

  const slot = document.getElementById('linkSlot');
  SoltriProgramUI.renderPrograms(m,slot);

  const note = document.getElementById('dNote');
  if(m.std){
    note.style.display='block';
    note.innerHTML='💡 이 기계는 <b>주축이 표준 방향</b>(M03=정회전)입니다. 다른 기계 대부분은 M03이 <b>역회전</b>이라, 같은 코드를 옮길 때 주축 방향을 확인하세요.';
  } else {
    note.style.display='block';
    note.innerHTML='💡 이 기계는 <b>M03=역회전</b>(M04=정회전)입니다. 6호기 등 표준 기계와 반대 — 프로그램 이식 시 주의.';
  }
  window.scrollTo(0,0);
}

function showSelect(){
  document.title='호기별 프로그램 — 김공장';
  if(location.hash){ history.pushState('', document.title, location.pathname); }
  document.getElementById('detail').style.display='none';
  document.getElementById('select').style.display='block';
}

function route(){
  document.title='호기별 프로그램 — 김공장';
  document.getElementById('machine-codes').open=false;
  const h = location.hash.replace('#m','');
  if(h && byNo[h]) showDetail(byNo[h]);
  else { document.getElementById('detail').style.display='none';
         document.getElementById('select').style.display='block'; }
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
